let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!s)s={play:0,moisture:70,light:50,health:80,friend:20,traits:[0,0,0,0,0,0],flower:null};
if(!Array.isArray(s.qIds)){s.qIds=[...Array(questions.length).keys()].sort(()=>Math.random()-.5).slice(0,10);s.answered=[];s.pending=null}
if(!Array.isArray(s.answered))s.answered=[];if(s.pending===undefined)s.pending=null;
let lastTick=Date.now(),lastAction=Date.now(),active=true;function save(){localStorage.setItem(KEY,JSON.stringify(s))}function speak(t){$('bubble').textContent=t}function touch(){lastAction=Date.now();active=true}
function winner(){let best='nemophila',bestScore=-Infinity;let t=s.traits||[0,0,0,0,0,0],tn=Math.sqrt(t.reduce((a,v)=>a+v*v,0))||1;for(const [k,f] of Object.entries(flowers)){let pn=Math.sqrt(f.p.reduce((a,v)=>a+v*v,0))||1,score=f.p.reduce((a,v,i)=>a+v*(t[i]||0),0)/(pn*tn);if(score>bestScore){bestScore=score;best=k}}return best}
const qThresholds=[.05,.12,.19,.26,.33,.40,.47,.54,.61,.68];
function checkQuestions(){if(s.pending!==null||phase()===4)return;let n=s.answered.length;if(n>=10)return;if(s.play/MAX>=qThresholds[n]){s.pending=s.qIds[n];save();speak('あのね、聞いてみたいことがあるの…！💌')}}
function showQuestion(){if(s.pending===null)return;let q=questions[s.pending];$('qhead').textContent='🌱 お花からの質問 '+(s.answered.length+1)+' / 10';$('qtext').textContent=q.q;$('choices').innerHTML='';q.a.forEach((a,i)=>{let b=document.createElement('button');b.textContent=a[0];b.onclick=()=>answerQuestion(i);$('choices').appendChild(b)});$('qmodal').classList.remove('hidden')}
function answerQuestion(i){let q=questions[s.pending],v=q.a[i][1];v.forEach((n,j)=>s.traits[j]=(s.traits[j]||0)+n*2.2);s.answered.push(s.pending);s.pending=null;$('qmodal').classList.add('hidden');s.friend=clamp(s.friend+3);speak('そっかぁ…♡ 教えてくれてありがとう');save();checkQuestions();render()}
function phase(){let p=s.play/MAX;if(p>=1)return 4;if(p>=.75)return 3;if(p>=.5)return 2;if(p>=.25)return 1;return 0}

function render(){checkQuestions();let p=phase(),key=s.flower||winner(),labels=['種','発芽','若葉','つぼみ','開花'];$('stage').textContent=labels[p];$('plantImg').src=imgFor(p,key);$('growth').style.width=clamp(s.play/MAX*100)+'%';['moisture','light','health','friend'].forEach(k=>$(k).style.width=clamp(s[k])+'%');if(p===4){if(!s.flower){s.flower=winner();save()}let f=flowers[s.flower];$('plantImg').src=f.bloom;$('result').classList.remove('hidden');$('result').innerHTML='✨ <b>'+f.name+'が咲きました！</b><br>花言葉「'+f.word+'」';$('actions').classList.add('hidden');speak('咲いたよ！一緒に育ててくれてありがとう♡')}else{$('result').classList.add('hidden');$('actions').classList.remove('hidden')}$('status').textContent=active?'一緒に過ごしているよ 🌱':'ひと休み中… 💤';$('plant').classList.toggle('sleep',!active);$('questionNotice').classList.toggle('hidden',s.pending===null||p===4)}
