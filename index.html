<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ちいさな花のお庭</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:linear-gradient(#dff5ff,#fff7fc);color:#4b5266;min-height:100vh;display:grid;place-items:center;padding:20px}.game{width:min(440px,100%);background:#ffffffcc;border:1px solid #fff;border-radius:28px;padding:22px;box-shadow:0 12px 40px #829bb326;text-align:center}h1{font-size:24px;margin:2px 0 6px;color:#657394}.sub{font-size:13px;margin:0 0 16px}.garden{height:260px;border-radius:24px;background:linear-gradient(#cfeeff 0 62%,#d9c7a7 62%);position:relative;overflow:hidden;display:grid;place-items:center}.sun{position:absolute;right:24px;top:22px;font-size:38px}.cloud{position:absolute;left:25px;top:34px;font-size:30px}.plant{font-size:86px;transform:translateY(30px);transition:.35s}.message{min-height:48px;margin:14px 0 8px;font-weight:600}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{background:#f5f4fb;border-radius:14px;padding:9px 4px;font-size:12px}.stat b{display:block;font-size:17px;margin-top:2px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}button{border:0;border-radius:16px;padding:13px 8px;font-size:15px;font-weight:700;color:#566078;background:#e8f6ff;cursor:pointer}button:nth-child(2){background:#fff0f7}button:nth-child(3){background:#f1ecff}button:nth-child(4){background:#eef8e9}.reset{margin-top:12px;background:transparent!important;font-size:12px;color:#8991a2;padding:8px}.spark{animation:pop .5s}@keyframes pop{50%{transform:translateY(30px) scale(1.16)}}
</style>
</head>
<body>
<main class="game">
<h1>🌱 ちいさな花のお庭</h1>
<p class="sub">お世話のしかたで、咲く花が変わるよ</p>
<section class="garden"><div class="cloud">☁️</div><div class="sun">☀️</div><div id="plant" class="plant">🫘</div></section>
<div id="message" class="message">小さな種を植えました。どんな花になるかな？</div>
<div class="stats">
<div class="stat">💧 水分<b id="water">0</b></div>
<div class="stat">☀️ 日光<b id="sun">0</b></div>
<div class="stat">🩷 愛情<b id="love">0</b></div>
</div>
<div class="actions">
<button id="waterBtn">💧 水をあげる</button><button id="sunBtn">☀️ ひなたへ</button><button id="talkBtn">🩷 話しかける</button><button id="foodBtn">🌿 肥料をあげる</button>
</div>
<button id="reset" class="reset">最初から育てる</button>
</main>
<script>
const s={water:0,sun:0,love:0,food:0,turn:0};
const $=id=>document.getElementById(id);
function update(action){s[action]++;s.turn++;$('water').textContent=s.water;$('sun').textContent=s.sun;$('love').textContent=s.love;let emoji='🫘',msg='種が土の中で目を覚ましはじめています…';if(s.turn>=2){emoji='🌱';msg='わあ！小さな芽が出たよ 🌱';}if(s.turn>=5){emoji='🌿';msg='葉っぱが増えて、すくすく育っています';}if(s.turn>=8){emoji='🪴';msg='もうすぐつぼみができそう…！';}if(s.turn>=11){if(s.love>=5){emoji='🌸';msg='愛情いっぱいの桜色の花が咲きました！';}else if(s.water>=4&&s.sun>=3){emoji='🩵';msg='幻の水色の花が咲きました！ ✨';}else if(s.sun>=5){emoji='🌻';msg='太陽が大好きな花が咲きました！';}else{emoji='🌷';msg='やさしい色の花が咲きました！';}}$('plant').textContent=emoji;$('message').textContent=msg;$('plant').classList.remove('spark');void $('plant').offsetWidth;$('plant').classList.add('spark');}
$('waterBtn').addEventListener('click',()=>update('water'));$('sunBtn').addEventListener('click',()=>update('sun'));$('talkBtn').addEventListener('click',()=>update('love'));$('foodBtn').addEventListener('click',()=>update('food'));$('reset').addEventListener('click',()=>location.reload());
</script>
</body>
</html>
