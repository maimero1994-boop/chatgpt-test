<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ちいさな花のお庭</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:linear-gradient(#dff5ff,#fff6fb);color:#535b70;min-height:100vh;padding:16px}.game{max-width:460px;margin:auto;background:#ffffffdc;border-radius:28px;padding:20px;box-shadow:0 12px 38px #7892aa25;text-align:center}h1{font-size:23px;margin:2px}.sub,.status{font-size:12px;color:#8990a0}.stage{font-size:12px;background:#f4f1fb;display:inline-block;padding:6px 12px;border-radius:16px;margin:8px}.garden{height:245px;border-radius:24px;background:linear-gradient(#cfedff 0 63%,#dbc8a8 63%);position:relative;display:grid;place-items:center;overflow:hidden}.plant{font-size:90px;transform:translateY(30px);cursor:pointer;user-select:none}.plant.pop{animation:pop .35s}@keyframes pop{50%{transform:translateY(30px) scale(1.12)}}.bubble{position:absolute;top:55px;left:50%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:9px 13px;max-width:82%;font-size:13px;font-weight:650;box-shadow:0 5px 15px #60708018}.sky{position:absolute;top:17px;font-size:30px}.sun{right:20px}.cloud{left:20px}.meters{text-align:left;margin:14px 2px}.meter{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:8px;margin:9px 0;font-size:13px;font-weight:650}.track{height:11px;background:#edf0f4;border-radius:10px;overflow:hidden}.fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#b7ddf4,#d6c8f2);transition:width .4s}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}button{border:0;border-radius:16px;padding:13px 7px;font-size:14px;font-weight:700;color:#596176;background:#e9f6ff}.result{background:#fff7fb;border-radius:18px;padding:13px;margin-top:12px;line-height:1.7}.hidden{display:none}.reset,.test{background:transparent;color:#a0a4af;font-size:11px;margin-top:7px}.sleep{opacity:.7}
</style></head><body><main class="game"><h1>🌱 ちいさな花のお庭</h1><p class="sub">お世話のしかたで、咲く花が変わるよ</p><div id="stage" class="stage"></div><section class="garden"><span class="sky cloud">☁️</span><span class="sky sun">☀️</span><div id="bubble" class="bubble">どんな花になるのかな…？</div><div id="plant" class="plant">🫘</div></section><div class="meters"><div class="meter">🌱 成長<div class="track"><div id="growth" class="fill"></div></div></div><div class="meter">💧 うるおい<div class="track"><div id="moisture" class="fill"></div></div></div><div class="meter">☀️ ひかり<div class="track"><div id="light" class="fill"></div></div></div><div class="meter">🌿 げんき<div class="track"><div id="health" class="fill"></div></div></div><div class="meter">🩷 なかよし<div class="track"><div id="friend" class="fill"></div></div></div></div><div id="actions" class="actions"><button data-a="water">💧 お水</button><button data-a="sun">☀️ ひなた</button><button data-a="care">🌿 お手入れ</button><button data-a="talk">🩷 おはなし</button></div><div id="result" class="result hidden"></div><div id="status" class="status">一緒に過ごしているよ 🌱</div><button id="test" class="test">テスト：次の成長段階へ</button><button id="reset" class="reset">育成データをリセット</button></main><script>
const KEY='littleFlowerGardenV4',MAX=72*3600,IDLE=300000,$=x=>document.getElementById(x),clamp=n=>Math.max(0,Math.min(100,n));
const flowers={hope:{name:'ガーベラ',emoji:'🌼',word:'希望'},kind:{name:'チューリップ',emoji:'🌷',word:'思いやり'},calm:{name:'ラベンダー',emoji:'🪻',word:'安らぎ'},dream:{name:'ひまわり',emoji:'🌻',word:'憧れ'},gentle:{name:'ネモフィラ',emoji:'💠',word:'可憐'}};
let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!s)s={play:0,moisture:70,light:50,health:80,friend:20,score:{hope:0,kind:0,calm:0,dream:0,gentle:0},flower:null};
let lastTick=Date.now(),lastAction=Date.now(),active=true;function save(){localStorage.setItem(KEY,JSON.stringify(s))}function speak(t){$('bubble').textContent=t}function touch(){lastAction=Date.now();active=true}
function winner(){let best='gentle',max=-1;Object.entries(s.score).forEach(([k,v])=>{if(v>max){max=v;best=k}});return best}
function phase(){let p=s.play/MAX;if(p>=1)return 4;if(p>=.75)return 3;if(p>=.5)return 2;if(p>=.25)return 1;return 0}
function bud(k){return{k:'🪻',hope:'🌼',kind:'🌷',calm:'🪻',dream:'🌻',gentle:'💠'}[k]||'🪴'}
function render(){let p=phase(),key=s.flower||winner(),labels=['種','発芽','若葉','つぼみ','開花'];$('stage').textContent=labels[p];let icons=['🫘','🌱','🌿',bud(key),flowers[key].emoji];$('plant').textContent=icons[p];$('growth').style.width=clamp(s.play/MAX*100)+'%';['moisture','light','health','friend'].forEach(k=>$(k).style.width=clamp(s[k])+'%');if(p===4){if(!s.flower){s.flower=winner();save()}let f=flowers[s.flower];$('result').classList.remove('hidden');$('result').innerHTML='✨ <b>'+f.name+'が咲きました！</b><br>花言葉「'+f.word+'」';$('actions').classList.add('hidden');speak('咲いたよ！一緒に育ててくれてありがとう♡')}else{$('result').classList.add('hidden');$('actions').classList.remove('hidden')} $('status').textContent=active?'一緒に過ごしているよ 🌱':'ひと休み中… 💤';$('plant').classList.toggle('sleep',!active)}
function act(a){touch();if(a==='water'){s.moisture+=25;s.score.kind+=2;s.score.gentle+=1;speak('お水ありがとう〜！💧')}if(a==='sun'){s.light+=22;s.score.hope+=2;s.score.dream+=2;speak('おひさま、あったかいなぁ☀️')}if(a==='care'){s.health+=7;s.score.calm+=2;s.score.kind+=1;speak('丁寧にしてくれてありがとう♪')}if(a==='talk'){s.friend+=5;s.score.gentle+=2;s.score.hope+=1;speak('お話できてうれしい♡')}['moisture','light','health','friend'].forEach(k=>s[k]=clamp(s[k]));save();render()}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));$('plant').onclick=()=>{touch();s.friend=clamp(s.friend+.4);s.score.gentle+=.2;speak('ふふっ♪');$('plant').classList.remove('pop');void $('plant').offsetWidth;$('plant').classList.add('pop');save();render()};
setInterval(()=>{let now=Date.now(),dt=(now-lastTick)/1000;lastTick=now;if(document.hidden)return;if(now-lastAction>=IDLE){if(active)speak('ちょっと休憩するね…💤');active=false;render();return}active=true;s.play=Math.min(MAX,s.play+dt);s.moisture=clamp(s.moisture-dt/900);s.light=clamp(s.light-dt/1200);save();render()},1000);
$('test').onclick=()=>{touch();let p=phase();s.play=Math.min(MAX,[.25,.5,.75,1,1][p]*MAX);save();render()};$('reset').onclick=()=>{if(confirm('最初から育て直しますか？')){localStorage.removeItem(KEY);location.reload()}};document.addEventListener('visibilitychange',()=>lastTick=Date.now());render();save();
</script></body></html>
