<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ちいさな花のお庭</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:linear-gradient(#dff5ff,#fff6fb);color:#535b70;min-height:100vh;padding:16px}.game{max-width:460px;margin:auto;background:#ffffffdc;border-radius:28px;padding:20px;box-shadow:0 12px 38px #7892aa25;text-align:center}h1{font-size:23px;margin:2px}.sub,.status{font-size:12px;color:#8990a0}.stage{font-size:12px;background:#f4f1fb;display:inline-block;padding:6px 12px;border-radius:16px;margin:8px}.garden{height:300px;border-radius:24px;background:linear-gradient(#cfedff 0 72%,#dbc8a8 72%);position:relative;display:grid;place-items:center;overflow:hidden}.plant{width:230px;height:230px;transform:translateY(30px);cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center}.plant img{max-width:100%;max-height:100%;object-fit:contain;border-radius:18px}.plant.pop{animation:pop .35s}@keyframes pop{50%{transform:translateY(30px) scale(1.08)}}.bubble{position:absolute;z-index:2;top:35px;left:50%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:9px 13px;max-width:82%;font-size:13px;font-weight:650;box-shadow:0 5px 15px #60708018}.sky{position:absolute;top:17px;font-size:30px}.sun{right:20px}.cloud{left:20px}.meters{text-align:left;margin:14px 2px}.meter{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:8px;margin:9px 0;font-size:13px;font-weight:650}.track{height:11px;background:#edf0f4;border-radius:10px;overflow:hidden}.fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#b7ddf4,#d6c8f2);transition:width .4s}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}button{border:0;border-radius:16px;padding:13px 7px;font-size:14px;font-weight:700;color:#596176;background:#e9f6ff}.result{background:#fff7fb;border-radius:18px;padding:13px;margin-top:12px;line-height:1.7}.hidden{display:none}.reset,.test{background:transparent;color:#a0a4af;font-size:11px;margin-top:7px}.sleep{opacity:.7}
</style></head><body><main class="game"><h1>🌱 ちいさな花のお庭</h1><p class="sub">お世話のしかたで、咲く花が変わるよ</p><div id="stage" class="stage"></div><section class="garden"><span class="sky cloud">☁️</span><span class="sky sun">☀️</span><div id="bubble" class="bubble">どんな花になるのかな…？</div><div id="plant" class="plant"><img id="plantImg" alt="育てている植物"></div></section><div class="meters"><div class="meter">🌱 成長<div class="track"><div id="growth" class="fill"></div></div></div><div class="meter">💧 うるおい<div class="track"><div id="moisture" class="fill"></div></div></div><div class="meter">☀️ ひかり<div class="track"><div id="light" class="fill"></div></div></div><div class="meter">🌿 げんき<div class="track"><div id="health" class="fill"></div></div></div><div class="meter">🩷 なかよし<div class="track"><div id="friend" class="fill"></div></div></div></div><div id="actions" class="actions"><button data-a="water">💧 お水</button><button data-a="sun">☀️ ひなた</button><button data-a="care">🌿 お手入れ</button><button data-a="talk">🩷 おはなし</button></div><div id="result" class="result hidden"></div><div id="status" class="status">一緒に過ごしているよ 🌱</div><button id="test" class="test">テスト：次の成長段階へ</button><button id="reset" class="reset">育成データをリセット</button></main><script>
const KEY='littleFlowerGardenV5',MAX=72*3600,IDLE=300000,$=x=>document.getElementById(x),clamp=n=>Math.max(0,Math.min(100,n));
const flowers={
nemophila:{name:'ネモフィラ',word:'可憐',bud:'nemophila_bud.png',bloom:'nemophila_bloom.png',p:[1,5,2,4,1,2]},
tulip:{name:'チューリップ',word:'思いやり',bud:'tulip_bud.png',bloom:'tulip_bloom.png',p:[3,5,2,3,1,2]},
gerbera:{name:'ガーベラ',word:'希望',bud:'gerbera_bud.png',bloom:'gerbera_bloom.png',p:[2,2,5,2,4,3]},
lavender:{name:'ラベンダー',word:'安らぎ',bud:'lavender_bud.png',bloom:'lavender_bloom.png',p:[2,3,1,5,1,3]},
sunflower:{name:'ひまわり',word:'憧れ',bud:'sunflower_bud.png',bloom:'sunflower_bloom.png',p:[2,2,5,1,5,3]},
rose:{name:'バラ',word:'愛',bud:'rose_bud.png',bloom:'rose_bloom.png',p:[5,3,2,2,3,1]},
lily:{name:'スズラン',word:'幸福',bud:'lily_of_the_valley_bud.png',bloom:'lily_of_the_valley_bloom.png',p:[3,3,4,5,1,2]},
babys:{name:'カスミソウ',word:'感謝',bud:'babys_breath_bud.png',bloom:'babys_breath_bloom.png',p:[4,5,2,3,1,1]},
marguerite:{name:'マーガレット',word:'信頼',bud:'marguerite_bud.png',bloom:'marguerite_bloom.png',p:[3,4,2,4,2,5]},
cosmos:{name:'コスモス',word:'調和',bud:'cosmos_bud.png',bloom:'cosmos_bloom.png',p:[3,5,3,5,2,3]}};
let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!s)s={play:0,moisture:70,light:50,health:80,friend:20,traits:[0,0,0,0,0,0],flower:null};
let lastTick=Date.now(),lastAction=Date.now(),active=true;function save(){localStorage.setItem(KEY,JSON.stringify(s))}function speak(t){$('bubble').textContent=t}function touch(){lastAction=Date.now();active=true}
function winner(){let best='nemophila',bestD=Infinity;for(const [k,f] of Object.entries(flowers)){let d=f.p.reduce((a,v,i)=>a+Math.pow((s.traits[i]||0)-v,2),0);if(d<bestD){bestD=d;best=k}}return best}
function phase(){let p=s.play/MAX;if(p>=1)return 4;if(p>=.75)return 3;if(p>=.5)return 2;if(p>=.25)return 1;return 0}
function imgFor(p,key){if(p===0)return'stage_seed.png';if(p===1)return'stage_sprout.png';if(p===2)return'stage_young.png';if(p===3)return flowers[key].bud;return flowers[key].bloom}
function render(){let p=phase(),key=s.flower||winner(),labels=['種','発芽','若葉','つぼみ','開花'];$('stage').textContent=labels[p];$('plantImg').src=imgFor(p,key);$('growth').style.width=clamp(s.play/MAX*100)+'%';['moisture','light','health','friend'].forEach(k=>$(k).style.width=clamp(s[k])+'%');if(p===4){if(!s.flower){s.flower=winner();save()}let f=flowers[s.flower];$('plantImg').src=f.bloom;$('result').classList.remove('hidden');$('result').innerHTML='✨ <b>'+f.name+'が咲きました！</b><br>花言葉「'+f.word+'」';$('actions').classList.add('hidden');speak('咲いたよ！一緒に育ててくれてありがとう♡')}else{$('result').classList.add('hidden');$('actions').classList.remove('hidden')}$('status').textContent=active?'一緒に過ごしているよ 🌱':'ひと休み中… 💤';$('plant').classList.toggle('sleep',!active)}
function add(v){v.forEach((n,i)=>s.traits[i]=(s.traits[i]||0)+n)}
function act(a){touch();if(a==='water'){s.moisture+=25;add([.4,1,.1,.5,0,.1]);speak('お水ありがとう〜！💧')}if(a==='sun'){s.light+=22;add([.1,.1,1,0,.8,.3]);speak('おひさま、あったかいなぁ☀️')}if(a==='care'){s.health+=7;add([.2,.7,.1,1,.1,.5]);speak('丁寧にしてくれてありがとう♪')}if(a==='talk'){s.friend+=5;add([1,.8,.4,.3,.2,.1]);speak('お話できてうれしい♡')}['moisture','light','health','friend'].forEach(k=>s[k]=clamp(s[k]));save();render()}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));$('plant').onclick=()=>{touch();s.friend=clamp(s.friend+.4);add([.3,.3,.1,.1,0,0]);speak('ふふっ♪');$('plant').classList.remove('pop');void $('plant').offsetWidth;$('plant').classList.add('pop');save();render()};
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,touch,{passive:true}));
setInterval(()=>{let now=Date.now(),dt=(now-lastTick)/1000;lastTick=now;if(document.hidden)return;if(now-lastAction>=IDLE){if(active)speak('ちょっと休憩するね…💤');active=false;render();return}active=true;s.play=Math.min(MAX,s.play+dt);s.moisture=clamp(s.moisture-dt/900);s.light=clamp(s.light-dt/1200);save();render()},1000);
$('test').onclick=()=>{touch();let p=phase();s.play=Math.min(MAX,[.25,.5,.75,1,1][p]*MAX);save();render()};$('reset').onclick=()=>{if(confirm('最初から育て直しますか？')){localStorage.removeItem(KEY);location.reload()}};document.addEventListener('visibilitychange',()=>{lastTick=Date.now();if(!document.hidden)touch()});render();save();
</script></body></html>
